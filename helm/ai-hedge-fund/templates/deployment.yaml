apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-hedge-fund
  namespace: ai-hedge-fund
  labels:
    app: ai-hedge-fund
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ai-hedge-fund
  template:
    metadata:
      labels:
        app: ai-hedge-fund
    spec:
      containers:
        - name: ai-hedge-fund
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: /app
            - name: ALLOWED_ORIGINS
              value: "https://ai-hedge-fund.istayintek.com,http://localhost:5173"
            - name: DATABASE_PATH
              value: /app/data/hedge_fund.db
          envFrom:
            - secretRef:
                name: ai-hedge-fund-secrets
                optional: true
          ports:
            - name: web
              containerPort: 8501
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /docs
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
